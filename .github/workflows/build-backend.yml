name: Backend CI/CD

on:
  push:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: harryjerry616
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build Server Image
        run: |
          docker build -t ghcr.io/harryjerry616/mern-server1:latest ./server

      - name: Push Server Image
        run: |
          docker push ghcr.io/harryjerry616/mern-server1:latest