services:
  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  client:
    image: ghcr.io/harryjerry616/mern-client:latest
    ports:
      - "3000:3000"
    depends_on:
      - server1
      - server2

  server1:
   image: ghcr.io/harryjerry616/mern-server1:latest
   depends_on:
    - mongodb
   environment:
    PORT: 8080
    MONGO_URI: mongodb://mongodb:27017/mern_devops
    JWT_SECRET: devsecret
    SERVER_NAME: Server 1

  server2:
   image: ghcr.io/harryjerry616/mern-server2:latest
   depends_on:
    - mongodb
   environment:
    PORT: 8080
    MONGO_URI: mongodb://mongodb:27017/mern_devops
    JWT_SECRET: devsecret
    SERVER_NAME: Server 2

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro,Z
    depends_on:
      - client
      - server1
      - server2
  
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

volumes:
  mongodb_data: